# upsmon is econut's last-resort backstop, not its main shutdown path.
#
# econut-guard shuts the machine down while it still has plenty of battery:
# on battery and below ECONUT_SHUTDOWN_BELOW (55% charge by default). This
# file covers the case where that daemon is dead, wedged or blind. upsmon
# then shuts down when the UPS itself reports low battery, which the EcoFlow
# raises at battery.charge.low (8% on the Delta 3 Ultra Plus) -- far below
# econut's level, so econut-guard acts first whenever it is working.
#
# Without this file upsmon has no MONITOR line and exits immediately, which
# leaves nut-monitor.service in the failed state and the backstop absent.
#
# The role is "secondary" deliberately. A primary upsmon creates
# POWERDOWNFLAG on its way down, and the NUT system-shutdown hook then sends
# a power-off through the APC HID subdriver to a unit that is not an APC.
# Nothing has established what that does to the EcoFlow's AC output, or
# whether the output returns when mains does, and the machine this protects
# sits behind that output. A secondary shuts this host down and never sends
# the UPS a power-off.
#
# install.sh fills the password in from /etc/nut/upsd.users.
MONITOR ecoflow@localhost 1 monitor CHANGE-ME-before-installing secondary

MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"

POLLFREQ 5
POLLFREQALERT 5
DEADTIME 15

# Everything goes to the journal (journalctl -u nut-monitor); the states that
# mean the machine is about to go also reach logged-in users.
NOTIFYFLAG ONLINE   SYSLOG
NOTIFYFLAG ONBATT   SYSLOG+WALL
NOTIFYFLAG LOWBATT  SYSLOG+WALL
NOTIFYFLAG FSD      SYSLOG+WALL
NOTIFYFLAG SHUTDOWN SYSLOG+WALL
NOTIFYFLAG COMMOK   SYSLOG
NOTIFYFLAG COMMBAD  SYSLOG
NOTIFYFLAG NOCOMM   SYSLOG
NOTIFYFLAG REPLBATT SYSLOG
