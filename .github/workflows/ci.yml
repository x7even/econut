# Checks that used to be run by hand on one machine, which meant they were as
# reliable as whoever remembered. This is a tool whose job is to power a
# machine off, so the checks that say it still works belong somewhere that
# cannot forget.
#
# Nothing here needs hardware. The parts that genuinely cannot be tested
# without the rig - a real power cut, udev rules landing on a serial node,
# systemd restarting the daemon - are verified by hand and recorded in the PR
# that changes them; see README. What is left is still most of the risk: the
# policy that decides to shut down, the status contract the CLI reads, and the
# installer that runs as root.
#
# Runner images are named explicitly, never ubuntu-latest, and both supported
# ones are tested. Two separate reasons, and it took being wrong once to
# separate them:
#
#  - What econut is deployed on. The rig this was written for runs Ubuntu 26.04
#    LTS, so 26.04 is the platform that matters and it is listed first.
#    Pinning only to 24.04 would have meant carefully testing an OS nobody
#    runs econut on.
#  - What the checks themselves depend on. shellcheck, and the bash, sed, awk
#    and grep that install.sh and its test harness run on, come from the image
#    rather than from this workflow. "latest" therefore means a green branch
#    can turn red because GitHub moved a label - and that label starts moving
#    to 26.04 on 2026-10-19. The Go tools are version-pinned for the same
#    reason.
#
# Naming both images gets both properties: the deployment target is covered,
# 24.04 keeps working for anyone still on it, and the day a new LTS appears is
# a deliberate commit that CI itself checks rather than a surprise.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing in this workflow publishes anything, so nothing here
# needs a token that could.
permissions:
  contents: read

jobs:
  go:
    name: go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every combination, so one failing still shows whether the rest
      # do - which is the difference between "26.04 broke it" and "1.22 broke
      # it".
      fail-fast: false
      matrix:
        # The OS matters here and not only in the shell job: go test runs
        # testdata/install_sh_functions.sh, so these tests go through the
        # image's bash, sed, awk and grep too.
        os: [ubuntu-26.04, ubuntu-24.04]
        # go.mod claims go 1.22, and this is the only thing that checks whether
        # that is still true. "stable" catches the opposite problem: code that
        # only compiles on the old version.
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - run: go build ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # -count=1 because several tests read deploy/install.sh and testdata, and
      # a cached pass would not notice those files changing. -race because the
      # guard polls on a ticker while writing the snapshot a second goroutine
      # may read.
      - run: go test -race -count=1 ./...

      - name: go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go mod tidy changed go.mod/go.sum; commit the result"
            git diff -- go.mod go.sum
            exit 1
          fi

  shell:
    # deploy/install.sh runs as root and rewrites NUT's configuration, so it
    # gets the same scrutiny as the Go code. Its testable functions are already
    # exercised by go test through testdata/install_sh_functions.sh; these are
    # the checks that read the whole file.
    name: shell on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bash -n
        run: |
          for f in deploy/install.sh testdata/install_sh_functions.sh; do
            bash -n "$f" || exit 1
          done

      # shellcheck comes from the runner image, not from this workflow, so the
      # two images may carry different versions; the version is printed so the
      # log says which one passed, and running both means a new release
      # reaching one image first is visible rather than mysterious.
      #
      # --severity=warning is the threshold that fails the build: warnings and
      # errors are things that can misbehave at run time, which in a
      # root-running installer is the whole point of this job. The info and
      # style notes left below the line are real but not defects here - SC2015
      # on "check && check || die", where die is meant to run if either check
      # fails, and SC2016 on literal $ characters inside the test harness's
      # fake passwords. Lowering the threshold would mean either rewriting
      # correct code or scattering disable directives until the tool stops
      # being read. --severity filters what is reported, not just what fails,
      # so run "shellcheck deploy/install.sh" with no flags locally to see the
      # notes below the line.
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck --severity=warning deploy/install.sh testdata/install_sh_functions.sh

  analyze:
    # staticcheck rather than golangci-lint: golangci-lint is a meta-runner
    # that needs a config file to behave predictably, and staticcheck is the
    # part of it worth having here. Both tools are pinned by version, so a new
    # release cannot turn a green branch red on its own.
    name: staticcheck + govulncheck
    # One image is enough here: these tools read the Go source, and nothing
    # they report depends on which Ubuntu they run on. It is the deployment
    # target, so a failure here is a failure where it counts.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # These tools track recent toolchains; the go 1.22 promise is the
          # other job's business. They still read the language version from
          # go.mod when analysing.
          go-version: stable
          check-latest: true

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      # econut has no dependencies, so this is watching the standard library
      # and the toolchain it was built with - which is where its vulnerabilities
      # would come from.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
